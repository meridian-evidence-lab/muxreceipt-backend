name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: muxreceipt-backend
      - uses: actions/checkout@v4
        with:
          repository: meridian-evidence-lab/muxreceipt-core
          ref: main
          path: muxreceipt-core
      - uses: actions/checkout@v4
        with:
          repository: meridian-evidence-lab/muxreceipt-review
          ref: main
          path: muxreceipt-review
      - uses: actions/checkout@v4
        with:
          repository: meridian-evidence-lab/muxreceipt-contracts
          ref: main
          path: muxreceipt-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: muxreceipt-backend
      - run: npm test
        working-directory: muxreceipt-backend
